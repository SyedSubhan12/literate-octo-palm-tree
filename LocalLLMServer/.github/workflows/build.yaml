name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Metal toolchain (needed by MLX on newer Xcode)
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project LocalLLMServer.xcodeproj -scheme LocalLLMServer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LocalLLMServer.app Payload/
          zip -qr LocalLLMServer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LocalLLMServer-ipa
          path: LocalLLMServer.ipa
